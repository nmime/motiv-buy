name: Auto Deploy

# ⚠️  MANUAL APPROVAL REQUIRED
#
# This workflow requires manual approval before deployments execute.
# Configure Environment Protection Rules in GitHub Settings:
#
# 1. Go to: Settings > Environments
# 2. Configure 'staging' environment:
#    - Required reviewers: Add team members who can approve staging deployments
#    - Wait timer: Optional delay before deployment (e.g., 5 minutes)
# 3. Configure 'production' environment:
#    - Required reviewers: Add team members who can approve production deployments
#    - Wait timer: Recommended 15-30 minutes for monitoring staging
#    - Deployment branches: Limit to 'master' branch only
#
# Without these rules configured, workflows will auto-deploy without approval!

on:
  # Deploy to production after CI completes on master (REQUIRES APPROVAL)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - master

  # Deploy to staging for PRs (REQUIRES APPROVAL)
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

  # Manual trigger for ad-hoc deployments (REQUIRES APPROVAL)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      pr_number:
        description: 'PR number (for staging deployments)'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to deploy'
        required: false
        type: string

concurrency:
  group: auto-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Determine Environment
  # ==============================================
  setup:
    name: Setup Deployment
    runs-on: [self-hosted, linux]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy-staging: ${{ steps.env.outputs.deploy-staging }}
      deploy-production: ${{ steps.env.outputs.deploy-production }}
      ref: ${{ steps.env.outputs.ref }}
      sha: ${{ steps.env.outputs.sha }}
      image-tag: ${{ steps.env.outputs.image-tag }}
      pr-number: ${{ steps.env.outputs.pr-number }}

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for CI to complete (PRs only)
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.pull_request.head.sha }}';
            const maxAttempts = 120; // 20 minutes max
            const pollInterval = 10000; // 10 seconds

            console.log('⏳ Waiting for CI workflow to complete...');
            console.log(`Commit SHA: ${sha}`);

            // Track the specific workflow run we're waiting for
            let targetRunId = null;

            for (let i = 0; i < maxAttempts; i++) {
              // Get workflow runs for this SHA, sorted by creation time
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 5  // Get a few runs to handle race conditions
              });

              if (workflowRuns.workflow_runs.length === 0) {
                console.log(`  No CI workflow found yet (${i + 1}/${maxAttempts})`);
                await new Promise(resolve => setTimeout(resolve, pollInterval));
                continue;
              }

              // Find the most recent run (by created_at)
              const runs = workflowRuns.workflow_runs.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              );
              const run = runs[0];

              // Lock onto the first run we see
              if (targetRunId === null) {
                targetRunId = run.id;
                console.log(`🎯 Tracking workflow run ID: ${targetRunId}`);
              } else if (run.id !== targetRunId) {
                console.log(`⚠️  Found different run (${run.id}), but tracking original (${targetRunId})`);
                // Find our target run in the list
                const targetRun = runs.find(r => r.id === targetRunId);
                if (!targetRun) {
                  core.setFailed(`❌ Lost track of target workflow run ${targetRunId}`);
                  return;
                }
                // Use the target run instead
                run.status = targetRun.status;
                run.conclusion = targetRun.conclusion;
              }

              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  console.log(`✅ CI workflow completed successfully (run ${run.id})`);
                  return;
                } else {
                  core.setFailed(`❌ CI workflow ${run.conclusion} (run ${run.id})`);
                  return;
                }
              }

              console.log(`  Still running... (${i + 1}/${maxAttempts}) - status: ${run.status}`);
              await new Promise(resolve => setTimeout(resolve, pollInterval));
            }

            core.setFailed('❌ CI workflow did not complete in 20 minutes');

      - name: Determine environment
        id: env
        run: |
          set -euo pipefail

          # Handle different event types
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            # PR - deploy to staging (runs from base branch context)
            echo "deploy-staging=true" >> $GITHUB_OUTPUT
            echo "deploy-production=false" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "image-tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "pr-number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "📋 Deploying PR #${{ github.event.pull_request.number }} to staging"

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger
            ENV="${{ inputs.environment }}"
            if [[ "$ENV" == "staging" ]]; then
              echo "deploy-staging=true" >> $GITHUB_OUTPUT
              echo "deploy-production=false" >> $GITHUB_OUTPUT
              echo "environment=staging" >> $GITHUB_OUTPUT

              # Use provided PR number or default tag
              if [[ -n "${{ inputs.pr_number }}" ]]; then
                echo "image-tag=pr-${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
                echo "pr-number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
              else
                echo "image-tag=staging" >> $GITHUB_OUTPUT
                echo "pr-number=" >> $GITHUB_OUTPUT
              fi
            else
              echo "deploy-staging=false" >> $GITHUB_OUTPUT
              echo "deploy-production=true" >> $GITHUB_OUTPUT
              echo "environment=production" >> $GITHUB_OUTPUT
              echo "image-tag=latest" >> $GITHUB_OUTPUT
              echo "pr-number=" >> $GITHUB_OUTPUT
            fi
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            # Use provided SHA or current SHA
            SHA="${{ inputs.commit_sha }}"
            echo "sha=${SHA:-${{ github.sha }}}" >> $GITHUB_OUTPUT

          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Push to master - deploy to production (workflow_run only for master branch)
            echo "deploy-staging=false" >> $GITHUB_OUTPUT
            echo "deploy-production=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "image-tag=latest" >> $GITHUB_OUTPUT
            echo "pr-number=" >> $GITHUB_OUTPUT
            echo "📋 Deploying ${{ github.event.workflow_run.head_branch }} to production"
          fi

  # ==============================================
  # Job 2: Retag CI Images for Deployment
  # ==============================================
  retag:
    name: Retag Images (${{ matrix.app }})
    runs-on: [self-hosted, linux]
    needs: setup

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image and retag for deployment
        run: |
          set -euo pipefail

          # Source image from CI workflow
          SOURCE_IMAGE="${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:ci-${{ needs.setup.outputs.sha }}"

          # Target tags for deployment
          TARGET_TAG="${{ needs.setup.outputs.image-tag }}"
          ENV_TAG="${{ needs.setup.outputs.environment }}-${{ needs.setup.outputs.sha }}"

          echo "📦 Pulling CI image: $SOURCE_IMAGE"

          # Retry logic with exponential backoff (max 4 attempts: 0s, 5s, 10s, 20s)
          MAX_ATTEMPTS=4
          ATTEMPT=1
          DELAY=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if [ $DELAY -gt 0 ]; then
              echo "Waiting ${DELAY}s before retry..."
              sleep $DELAY
            fi

            if docker pull "$SOURCE_IMAGE"; then
              echo "✅ Successfully pulled image"
              break
            else
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "❌ Failed to pull image after $MAX_ATTEMPTS attempts"
                echo "This usually means the CI workflow didn't push the image successfully"
                echo "Check the CI workflow logs for commit ${{ needs.setup.outputs.sha }}"
                exit 1
              fi

              echo "⚠️  Pull failed, will retry..."
              ATTEMPT=$((ATTEMPT + 1))
              # Calculate exponential backoff delay
              if [ $DELAY -eq 0 ]; then
                DELAY=5
              else
                DELAY=$((DELAY * 2))
              fi
            fi
          done

          echo "🏷️  Retagging for deployment..."
          docker tag "$SOURCE_IMAGE" "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$TARGET_TAG"
          docker tag "$SOURCE_IMAGE" "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$ENV_TAG"

          echo "⬆️  Pushing deployment tags..."
          docker push "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$TARGET_TAG"
          docker push "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$ENV_TAG"

          echo "✅ Successfully retagged ${{ matrix.app }}"

  # ==============================================
  # Job 3: Deploy to Staging (PR)
  # ==============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, linux]
    needs: [setup, retag]
    if: needs.setup.outputs.deploy-staging == 'true'

    # This creates the deployment in GitHub UI and enforces environment protection rules
    environment:
      name: staging
      url: https://api.st.motivbuy.com

    permissions:
      contents: read
      deployments: write
      pull-requests: write  # Required to comment on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Create deployment status
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const prNumber = '${{ needs.setup.outputs.pr-number }}';
            const description = prNumber
              ? `Deploy PR #${prNumber} to staging`
              : 'Deploy to staging';

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.setup.outputs.sha }}',
              environment: 'staging',
              description: description,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to staging...',
              environment_url: 'https://api.st.motivbuy.com',
              auto_inactive: true
            });

            return deployment.data.id;

      - name: Setup SSH
        run: |
          set -euo pipefail

          # Validate required secrets
          if [ -z "${{ vars.VPS_HOST }}" ]; then
            echo "❌ Error: VPS_HOST environment variable is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Error: VPS_SSH_KEY secret is not defined"
            exit 1
          fi

          # Ensure SSH key is cleaned up on any failure
          cleanup_ssh() {
            rm -f ~/.ssh/id_rsa
          }
          trap cleanup_ssh EXIT ERR

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📡 Adding VPS host to known_hosts..."
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run database migrations
        id: migrate
        run: |
          set -euo pipefail
          echo "🗄️  Running database migrations..."
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'MIGRATE_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Check if API container is running
          if docker compose ps api 2>/dev/null | grep -q "Up"; then
            echo "API container is running, executing migrations..."
            if docker compose exec -T api pnpm run migration:run; then
              echo "✅ Migrations completed successfully"
            else
              echo "❌ Migration failed"
              docker compose logs api --tail=50
              exit 1
            fi
          else
            echo "⚠️  API container not running - first deployment detected"
            echo "Migrations will run automatically when container starts"
            echo "NOTE: Ensure your container entrypoint runs migrations on startup"
          fi
          MIGRATE_EOF

      - name: Deploy to staging
        id: deploy
        run: |
          set -euo pipefail

          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "mkdir -p ${{ vars.VPS_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/
          fi

          # Create environment file with proper error handling
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ vars.VPS_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=staging
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=${{ needs.setup.outputs.image-tag }}
          API_PORT=${{ secrets.API_PORT || '3000' }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=debug
          API_DOMAIN=api.st.motivbuy.com
          BOT_DOMAIN=bot.st.motivbuy.com
          MAIN_DOMAIN=st.motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          ENVFILE
          chmod 600 ${{ vars.VPS_DEPLOY_PATH }}/.env
          ENV_EOF

          # Deploy (pass token via stdin to avoid process list exposure)
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "cd ${{ vars.VPS_DEPLOY_PATH }} && docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin && docker compose pull && docker compose up -d --remove-orphans && docker image prune -af --filter 'until=24h'" \
            <<< '${{ secrets.GITHUB_TOKEN }}'
          echo '✅ Staging deployment completed'

      - name: Health check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Load and validate API_PORT from .env
          if [ ! -f .env ]; then
            echo "❌ .env file not found"
            exit 1
          fi

          API_PORT=$(grep '^API_PORT=' .env | cut -d '=' -f2 | tr -d '\r')
          if [ -z "$API_PORT" ]; then
            echo "⚠️  API_PORT not found in .env, using default 3000"
            API_PORT=3000
          elif ! [[ "$API_PORT" =~ ^[0-9]+$ ]] || [ "$API_PORT" -lt 1 ] || [ "$API_PORT" -gt 65535 ]; then
            echo "❌ Invalid API_PORT in .env: $API_PORT (must be 1-65535)"
            exit 1
          fi
          echo "Using API_PORT=${API_PORT}"

          echo '⏳ Waiting for services to become healthy...'
          if ! timeout 60 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'; then
            echo '❌ Timeout waiting for services to become healthy'
            docker compose ps
            docker compose logs --tail=50
            exit 1
          fi
          if curl -f "http://localhost:${API_PORT}/health"; then
            echo '✅ Staging health check passed'
          else
            echo '❌ Staging health check failed'
            docker compose logs --tail=50
            exit 1
          fi
          HEALTH_EOF

      - name: Update deployment status - Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Successfully deployed to staging',
              environment_url: 'https://api.st.motivbuy.com',
              auto_inactive: true
            });

      - name: Update deployment status - Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment to staging failed',
              environment_url: 'https://api.st.motivbuy.com',
              auto_inactive: true
            });

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

      - name: Comment on PR
        if: always() && needs.setup.outputs.pr-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = status === 'success'
              ? 'Deployment to staging succeeded!'
              : 'Deployment to staging failed!';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.setup.outputs.pr-number }},
              body: `${emoji} **Staging Deployment ${status}**\n\n` +
                    `${message}\n\n` +
                    `- **Environment**: staging\n` +
                    `- **Commit**: ${{ needs.setup.outputs.sha }}\n` +
                    `- **API URL**: https://api.st.motivbuy.com\n` +
                    `- **Health Check**: https://api.st.motivbuy.com/health\n\n` +
                    `[View deployment logs](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });

  # ==============================================
  # Job 4: Deploy to Production (Push to master)
  # ==============================================
  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [setup, retag]
    if: needs.setup.outputs.deploy-production == 'true'

    # This creates the deployment in GitHub UI and enforces environment protection rules
    environment:
      name: production
      url: https://api.motivbuy.com

    permissions:
      contents: read
      deployments: write
      pull-requests: write  # Required to comment on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Create deployment status
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.setup.outputs.sha }}',
              environment: 'production',
              description: 'Deploy to production',
              auto_merge: false,
              required_contexts: [],
              production_environment: true
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to production...',
              environment_url: 'https://api.motivbuy.com',
              auto_inactive: false
            });

            return deployment.data.id;

      - name: Setup SSH
        run: |
          set -euo pipefail

          # Validate required secrets
          if [ -z "${{ vars.VPS_HOST }}" ]; then
            echo "❌ Error: VPS_HOST environment variable is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Error: VPS_SSH_KEY secret is not defined"
            exit 1
          fi

          # Ensure SSH key is cleaned up on any failure
          cleanup_ssh() {
            rm -f ~/.ssh/id_rsa
          }
          trap cleanup_ssh EXIT ERR

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📡 Adding VPS host to known_hosts..."
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup current deployment
        id: backup
        run: |
          set -euo pipefail
          echo "📦 Backing up current deployment state..."
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'BACKUP_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}
          # Save current image tags for rollback
          docker compose images --format json > .deployment-backup.json || echo '[]' > .deployment-backup.json
          # Backup current .env
          cp .env .env.backup 2>/dev/null || true
          echo "✅ Backup completed"
          BACKUP_EOF

      - name: Run database migrations
        id: migrate
        run: |
          set -euo pipefail
          echo "🗄️  Running database migrations..."
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'MIGRATE_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Check if API container is running
          if docker compose ps api 2>/dev/null | grep -q "Up"; then
            echo "API container is running, executing migrations..."
            if docker compose exec -T api pnpm run migration:prod; then
              echo "✅ Migrations completed successfully"
            else
              echo "❌ Migration failed"
              docker compose logs api --tail=50
              exit 1
            fi
          else
            echo "⚠️  API container not running - first deployment detected"
            echo "Migrations will run automatically when container starts"
            echo "NOTE: Ensure your container entrypoint runs migrations on startup"
          fi
          MIGRATE_EOF

      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail

          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "mkdir -p ${{ vars.VPS_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/
          fi

          # Create environment file with proper error handling
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ vars.VPS_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=production
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest
          API_PORT=${{ secrets.API_PORT || '3000' }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=warn
          API_DOMAIN=api.motivbuy.com
          BOT_DOMAIN=bot.motivbuy.com
          MAIN_DOMAIN=motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          ENVFILE
          chmod 600 ${{ vars.VPS_DEPLOY_PATH }}/.env
          ENV_EOF

          # Deploy (pass token via stdin to avoid process list exposure)
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "cd ${{ vars.VPS_DEPLOY_PATH }} && docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin && docker compose pull && docker compose up -d --remove-orphans --no-deps api bot && sleep 10 && docker image prune -af --filter 'until=48h'" \
            <<< '${{ secrets.GITHUB_TOKEN }}'
          echo '✅ Production deployment completed'

      - name: Health check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Load and validate API_PORT from .env
          if [ ! -f .env ]; then
            echo "❌ .env file not found"
            exit 1
          fi

          API_PORT=$(grep '^API_PORT=' .env | cut -d '=' -f2 | tr -d '\r')
          if [ -z "$API_PORT" ]; then
            echo "⚠️  API_PORT not found in .env, using default 3000"
            API_PORT=3000
          elif ! [[ "$API_PORT" =~ ^[0-9]+$ ]] || [ "$API_PORT" -lt 1 ] || [ "$API_PORT" -gt 65535 ]; then
            echo "❌ Invalid API_PORT in .env: $API_PORT (must be 1-65535)"
            exit 1
          fi
          echo "Using API_PORT=${API_PORT}"

          echo '⏳ Waiting for services to become healthy...'
          if ! timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 3; done'; then
            echo '❌ Timeout waiting for services to become healthy'
            docker compose ps
            docker compose logs --tail=50
            exit 1
          fi
          if curl -f "http://localhost:${API_PORT}/health"; then
            echo '✅ Production health check passed'
          else
            echo '❌ Production health check failed'
            docker compose logs --tail=50
            exit 1
          fi
          HEALTH_EOF

      - name: Smoke tests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'SMOKE_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Load and validate API_PORT from .env
          if [ ! -f .env ]; then
            echo "❌ .env file not found"
            exit 1
          fi

          API_PORT=$(grep '^API_PORT=' .env | cut -d '=' -f2 | tr -d '\r')
          if [ -z "$API_PORT" ]; then
            echo "⚠️  API_PORT not found in .env, using default 3000"
            API_PORT=3000
          elif ! [[ "$API_PORT" =~ ^[0-9]+$ ]] || [ "$API_PORT" -lt 1 ] || [ "$API_PORT" -gt 65535 ]; then
            echo "❌ Invalid API_PORT in .env: $API_PORT (must be 1-65535)"
            exit 1
          fi

          if curl -f "http://localhost:${API_PORT}/health" && curl -f "http://localhost:${API_PORT}/api"; then
            echo '✅ Production smoke tests passed'
          else
            echo '❌ Production smoke tests failed'
            exit 1
          fi
          SMOKE_EOF

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          echo "🔄 Rolling back to previous deployment..."
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'ROLLBACK_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Restore previous .env if it exists
          if [ -f .env.backup ]; then
            mv .env.backup .env
            echo "✅ Restored previous .env"
          else
            echo "⚠️  No .env backup found, keeping current .env"
          fi

          # Load API_PORT from .env with validation
          API_PORT=$(grep '^API_PORT=' .env | cut -d '=' -f2 | tr -d '\r' || echo '3000')
          if ! [[ "$API_PORT" =~ ^[0-9]+$ ]] || [ "$API_PORT" -lt 1 ] || [ "$API_PORT" -gt 65535 ]; then
            echo "❌ Invalid API_PORT: $API_PORT, using default 3000"
            API_PORT=3000
          fi

          # Rollback to previous images by restarting with restored .env
          echo "🔄 Restarting services with previous version..."
          docker compose down

          # The .env.backup contains the old IMAGE_TAG, so docker compose will pull old images
          docker compose pull
          docker compose up -d --remove-orphans

          echo "⏳ Waiting for services to stabilize..."
          sleep 15

          if curl -f "http://localhost:${API_PORT}/health"; then
            echo "✅ Rollback successful - services are healthy"
          else
            echo "❌ Rollback completed but services may need manual intervention"
            docker compose ps
            docker compose logs --tail=30
          fi
          ROLLBACK_EOF

          echo "⚠️  Deployment failed and was rolled back. Please check the logs above."
          exit 1

      - name: Update deployment status - Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Successfully deployed to production',
              environment_url: 'https://api.motivbuy.com',
              auto_inactive: false
            });

      - name: Update deployment status - Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment to production failed',
              environment_url: 'https://api.motivbuy.com',
              auto_inactive: false
            });

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ==============================================
  # Job 5: Deployment Summary
  # ==============================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux]
    needs: [setup, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ needs.setup.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.setup.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ needs.setup.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Staging deployment status
          if [[ "${{ needs.setup.outputs.deploy-staging }}" == "true" ]]; then
            echo "**Staging Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.st.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.st.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Production deployment status
          if [[ "${{ needs.setup.outputs.deploy-production }}" == "true" ]]; then
            echo "**Production Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
