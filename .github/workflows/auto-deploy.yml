name: Auto Deploy

on:
  # Deploy to production after CI completes on master
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - master

  # Deploy to staging for PRs (runs from base branch context)
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

  # Manual trigger for ad-hoc deployments
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      pr_number:
        description: 'PR number (for staging deployments)'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to deploy'
        required: false
        type: string

concurrency:
  group: auto-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Determine Environment
  # ==============================================
  setup:
    name: Setup Deployment
    runs-on: [self-hosted, linux]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy-staging: ${{ steps.env.outputs.deploy-staging }}
      deploy-production: ${{ steps.env.outputs.deploy-production }}
      ref: ${{ steps.env.outputs.ref }}
      sha: ${{ steps.env.outputs.sha }}
      image-tag: ${{ steps.env.outputs.image-tag }}
      pr-number: ${{ steps.env.outputs.pr-number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for CI to complete (PRs only)
        if: github.event_name == 'pull_request_target'
        run: |
          set -euo pipefail

          echo "⏳ Waiting for CI workflow to complete..."
          SHA="${{ github.event.pull_request.head.sha }}"

          # Poll for CI workflow completion (max 20 minutes)
          for i in {1..120}; do
            # Get workflow runs for this SHA
            STATUS=$(gh run list \
              --workflow=ci.yml \
              --commit="$SHA" \
              --json status,conclusion \
              --jq '.[0] | select(.status == "completed") | .conclusion')

            if [[ "$STATUS" == "success" ]]; then
              echo "✅ CI workflow completed successfully"
              break
            elif [[ "$STATUS" == "failure" ]] || [[ "$STATUS" == "cancelled" ]]; then
              echo "❌ CI workflow failed or was cancelled"
              exit 1
            fi

            echo "  Still running... (${i}/120)"
            sleep 10
          done

          if [[ "$STATUS" != "success" ]]; then
            echo "❌ CI workflow did not complete in 20 minutes"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine environment
        id: env
        run: |
          set -euo pipefail

          # Handle different event types
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            # PR - deploy to staging (runs from base branch context)
            echo "deploy-staging=true" >> $GITHUB_OUTPUT
            echo "deploy-production=false" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "image-tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "pr-number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "📋 Deploying PR #${{ github.event.pull_request.number }} to staging"

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger
            ENV="${{ inputs.environment }}"
            if [[ "$ENV" == "staging" ]]; then
              echo "deploy-staging=true" >> $GITHUB_OUTPUT
              echo "deploy-production=false" >> $GITHUB_OUTPUT
              echo "environment=staging" >> $GITHUB_OUTPUT

              # Use provided PR number or default tag
              if [[ -n "${{ inputs.pr_number }}" ]]; then
                echo "image-tag=pr-${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
                echo "pr-number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
              else
                echo "image-tag=staging" >> $GITHUB_OUTPUT
                echo "pr-number=" >> $GITHUB_OUTPUT
              fi
            else
              echo "deploy-staging=false" >> $GITHUB_OUTPUT
              echo "deploy-production=true" >> $GITHUB_OUTPUT
              echo "environment=production" >> $GITHUB_OUTPUT
              echo "image-tag=latest" >> $GITHUB_OUTPUT
              echo "pr-number=" >> $GITHUB_OUTPUT
            fi
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            # Use provided SHA or current SHA
            SHA="${{ inputs.commit_sha }}"
            echo "sha=${SHA:-${{ github.sha }}}" >> $GITHUB_OUTPUT

          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Push to master - deploy to production (workflow_run only for master branch)
            echo "deploy-staging=false" >> $GITHUB_OUTPUT
            echo "deploy-production=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "image-tag=latest" >> $GITHUB_OUTPUT
            echo "pr-number=" >> $GITHUB_OUTPUT
            echo "📋 Deploying ${{ github.event.workflow_run.head_branch }} to production"
          fi

  # ==============================================
  # Job 2: Retag CI Images for Deployment
  # ==============================================
  retag:
    name: Retag Images (${{ matrix.app }})
    runs-on: [self-hosted, linux]
    needs: setup

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image and retag for deployment
        run: |
          set -euo pipefail

          # Source image from CI workflow
          SOURCE_IMAGE="${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:ci-${{ needs.setup.outputs.sha }}"

          # Target tags for deployment
          TARGET_TAG="${{ needs.setup.outputs.image-tag }}"
          ENV_TAG="${{ needs.setup.outputs.environment }}-${{ needs.setup.outputs.sha }}"

          echo "📦 Pulling CI image: $SOURCE_IMAGE"
          docker pull "$SOURCE_IMAGE"

          echo "🏷️  Retagging for deployment..."
          docker tag "$SOURCE_IMAGE" "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$TARGET_TAG"
          docker tag "$SOURCE_IMAGE" "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$ENV_TAG"

          echo "⬆️  Pushing deployment tags..."
          docker push "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$TARGET_TAG"
          docker push "${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:$ENV_TAG"

          echo "✅ Successfully retagged ${{ matrix.app }}"

  # ==============================================
  # Job 3: Deploy to Staging (PR)
  # ==============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, linux]
    needs: [setup, retag]
    if: needs.setup.outputs.deploy-staging == 'true'

    # This creates the deployment in GitHub UI and enforces environment protection rules
    environment:
      name: staging
      url: https://api.st.motivbuy.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Create deployment status
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.setup.outputs.sha }}',
              environment: 'staging',
              description: 'Deploy PR #${{ github.event.pull_request.number }} to staging',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to staging...',
              environment_url: 'https://api.st.motivbuy.com',
              auto_inactive: true
            });

            return deployment.data.id;

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging
        id: deploy
        run: |
          set -euo pipefail

          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "mkdir -p ${{ vars.VPS_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/
          fi

          # Create environment file
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ vars.VPS_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=staging
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=${{ needs.setup.outputs.image-tag }}
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=debug
          API_DOMAIN=api.st.motivbuy.com
          BOT_DOMAIN=bot.st.motivbuy.com
          MAIN_DOMAIN=st.motivbuy.com
          LETSENCRYPT_EMAIL=${{ vars.LETSENCRYPT_EMAIL }}
          ENVFILE
          ENV_EOF

          # Deploy
          cat > /tmp/deploy-script.sh << 'SCRIPT_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}
          docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker compose pull
          echo '🚀 Deploying to staging...'
          docker compose up -d --remove-orphans
          docker image prune -af --filter 'until=24h'
          echo '✅ Staging deployment completed'
          SCRIPT_EOF

          chmod +x /tmp/deploy-script.sh
          echo '${{ secrets.GITHUB_TOKEN }}' | ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            'bash -s' < /tmp/deploy-script.sh
          rm -f /tmp/deploy-script.sh

      - name: Health check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          timeout 60 sh -c 'until docker compose -f ${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml ps | grep -q "healthy"; do sleep 2; done' || true
          if curl -f http://localhost:3000/health; then
            echo '✅ Staging health check passed'
          else
            echo '❌ Staging health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Update deployment status - Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Successfully deployed to staging',
              environment_url: 'https://api.st.motivbuy.com',
              auto_inactive: true
            });

      - name: Update deployment status - Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment to staging failed',
              environment_url: 'https://api.st.motivbuy.com',
              auto_inactive: true
            });

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

      - name: Comment on PR
        if: always() && needs.setup.outputs.pr-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = status === 'success'
              ? 'Deployment to staging succeeded!'
              : 'Deployment to staging failed!';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.setup.outputs.pr-number }},
              body: `${emoji} **Staging Deployment ${status}**\n\n` +
                    `${message}\n\n` +
                    `- **Environment**: staging\n` +
                    `- **Commit**: ${{ needs.setup.outputs.sha }}\n` +
                    `- **API URL**: https://api.st.motivbuy.com\n` +
                    `- **Health Check**: https://api.st.motivbuy.com/health\n\n` +
                    `[View deployment logs](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });

  # ==============================================
  # Job 4: Deploy to Production (Push to master)
  # ==============================================
  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [setup, retag]
    if: needs.setup.outputs.deploy-production == 'true'

    # This creates the deployment in GitHub UI and enforces environment protection rules
    environment:
      name: production
      url: https://api.motivbuy.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Create deployment status
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.setup.outputs.sha }}',
              environment: 'production',
              description: 'Deploy to production',
              auto_merge: false,
              required_contexts: [],
              production_environment: true
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to production...',
              environment_url: 'https://api.motivbuy.com',
              auto_inactive: false
            });

            return deployment.data.id;

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail

          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "mkdir -p ${{ vars.VPS_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/
          fi

          # Create environment file
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ vars.VPS_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=production
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=warn
          API_DOMAIN=api.motivbuy.com
          BOT_DOMAIN=bot.motivbuy.com
          MAIN_DOMAIN=motivbuy.com
          LETSENCRYPT_EMAIL=${{ vars.LETSENCRYPT_EMAIL }}
          ENVFILE
          ENV_EOF

          # Deploy
          cat > /tmp/deploy-script.sh << 'SCRIPT_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}
          docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker compose pull
          echo '🚀 Deploying to production...'
          docker compose up -d --remove-orphans --no-deps api bot
          echo '⏳ Waiting for services...'
          sleep 10
          docker image prune -af --filter 'until=48h'
          echo '✅ Production deployment completed'
          SCRIPT_EOF

          chmod +x /tmp/deploy-script.sh
          echo '${{ secrets.GITHUB_TOKEN }}' | ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            'bash -s' < /tmp/deploy-script.sh
          rm -f /tmp/deploy-script.sh

      - name: Health check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}
          timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 3; done' || true
          if curl -f http://localhost:3000/health; then
            echo '✅ Production health check passed'
          else
            echo '❌ Production health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Smoke tests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'SMOKE_EOF'
          set -euo pipefail
          if curl -f http://localhost:3000/health && curl -f http://localhost:3000/api; then
            echo '✅ Production smoke tests passed'
          else
            echo '❌ Production smoke tests failed'
            exit 1
          fi
          SMOKE_EOF

      - name: Update deployment status - Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Successfully deployed to production',
              environment_url: 'https://api.motivbuy.com',
              auto_inactive: false
            });

      - name: Update deployment status - Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment to production failed',
              environment_url: 'https://api.motivbuy.com',
              auto_inactive: false
            });

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ==============================================
  # Job 5: Deployment Summary
  # ==============================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux]
    needs: [setup, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ needs.setup.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.setup.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ needs.setup.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Staging deployment status
          if [[ "${{ needs.setup.outputs.deploy-staging }}" == "true" ]]; then
            echo "**Staging Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.st.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.st.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Production deployment status
          if [[ "${{ needs.setup.outputs.deploy-production }}" == "true" ]]; then
            echo "**Production Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
