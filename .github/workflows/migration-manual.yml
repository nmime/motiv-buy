name: Database Migration - Manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Migration action'
        required: true
        type: choice
        options:
          - status
          - up
          - down
        default: status
      confirm:
        description: 'Type "CONFIRM" to proceed with migration'
        required: true
        type: string

concurrency:
  group: migration-${{ inputs.environment }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Validation
  # ==============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - name: Validate confirmation
        id: check
        run: |
          if [[ "${{ inputs.confirm }}" != "CONFIRM" ]]; then
            echo "❌ Migration aborted - confirmation string must be 'CONFIRM'"
            echo "You entered: '${{ inputs.confirm }}'"
            exit 1
          fi

          echo "✅ Confirmation validated"
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Display migration details
        run: |
          echo "### 🗄️ Database Migration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ inputs.action }}" == "down" ]]; then
            echo "⚠️ **WARNING**: This will ROLLBACK the last migration!" >> $GITHUB_STEP_SUMMARY
          fi

  # ==============================================
  # Job 2: Build Migration Container
  # ==============================================
  build:
    name: Build Migration Image
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=migration
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:${{ inputs.environment }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:${{ inputs.environment }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================
  # Job 3: Run Migration on Staging
  # ==============================================
  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    needs: build
    if: inputs.environment == 'staging'
    environment:
      name: staging
      url: https://st.motivbuy.com

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Run migration
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            cd ${{ secrets.VPS_STAGING_DEPLOY_PATH }}

            # Login to registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest migration image
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:staging

            # Run migration
            echo '🔄 Running migration ${{ inputs.action }}...'

            docker run --rm \
              --network ${{ secrets.VPS_STAGING_DEPLOY_PATH }}_default \
              -e NODE_ENV=staging \
              -e DB_HOST=postgres-prod \
              -e DB_PORT=5432 \
              -e DB_NAME=${{ secrets.STAGING_DB_NAME }} \
              -e DB_USER=${{ secrets.STAGING_DB_USER }} \
              -e DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }} \
              ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:staging \
              node dist/apps/migration/main.js ${{ inputs.action }}

            echo '✅ Migration completed'
          "

      - name: Migration summary
        if: always()
        run: |
          echo "### 📊 Migration Result - Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ **Migration successful!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Migration failed!**" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ==============================================
  # Job 4: Run Migration on Production
  # ==============================================
  migrate-production:
    name: Migrate Production
    runs-on: ubuntu-latest
    needs: build
    if: inputs.environment == 'production'
    environment:
      name: production
      url: https://motivbuy.com

    steps:
      - name: Production safety warning
        run: |
          echo "⚠️ **PRODUCTION MIGRATION**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You are about to run a migration on PRODUCTION database." >> $GITHUB_STEP_SUMMARY
          echo "Please ensure you have:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Tested migration on staging" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Reviewed migration SQL" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Backed up production database" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Notified team members" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create database backup
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            # Create backup directory
            mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups

            # Backup database
            BACKUP_FILE=${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/pre-migration-\$(date +%Y%m%d-%H%M%S).sql
            docker compose -f ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml exec -T postgres \
              pg_dump -U ${{ secrets.PRODUCTION_DB_USER }} ${{ secrets.PRODUCTION_DB_NAME }} > \$BACKUP_FILE

            echo '✅ Database backup created: '\$BACKUP_FILE

            # Keep only last 10 backups
            ls -t ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/pre-migration-*.sql 2>/dev/null | tail -n +11 | xargs rm -f || true
          "

      - name: Run migration
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            # Login to registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest migration image
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:production

            # Run migration
            echo '🔄 Running migration ${{ inputs.action }}...'

            docker run --rm \
              --network ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}_default \
              -e NODE_ENV=production \
              -e DB_HOST=postgres-prod \
              -e DB_PORT=5432 \
              -e DB_NAME=${{ secrets.PRODUCTION_DB_NAME }} \
              -e DB_USER=${{ secrets.PRODUCTION_DB_USER }} \
              -e DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }} \
              ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:production \
              node dist/apps/migration/main.js ${{ inputs.action }}

            echo '✅ Migration completed'
          "

      - name: Verify migration
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            # Check migration status
            echo '📊 Current migration status:'
            docker run --rm \
              --network ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}_default \
              -e NODE_ENV=production \
              -e DB_HOST=postgres-prod \
              -e DB_PORT=5432 \
              -e DB_NAME=${{ secrets.PRODUCTION_DB_NAME }} \
              -e DB_USER=${{ secrets.PRODUCTION_DB_USER }} \
              -e DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }} \
              ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-migration:production \
              node dist/apps/migration/main.js status
          "

      - name: Migration summary
        if: always()
        run: |
          echo "### 📊 Migration Result - Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ **Migration successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Verify application functionality" >> $GITHUB_STEP_SUMMARY
            echo "2. Monitor error logs" >> $GITHUB_STEP_SUMMARY
            echo "3. Check database backup if rollback needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Migration failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Recovery steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Check error logs above" >> $GITHUB_STEP_SUMMARY
            echo "2. Database backup available in backups/ directory" >> $GITHUB_STEP_SUMMARY
            echo "3. Consider running 'down' action to rollback" >> $GITHUB_STEP_SUMMARY
          fi
