name: Deploy - Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Branch or tag to deploy'
        required: false
        type: string
        default: ''

concurrency:
  group: staging-deployment-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Validate Branch
  # ==============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Extract branch name
        id: branch
        run: |
          # Get branch name and sanitize it for Docker tag
          if [[ -n "${{ inputs.ref }}" ]]; then
            BRANCH_NAME="${{ inputs.ref }}"
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
          fi
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          echo "original=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Check if not master branch
        run: |
          BRANCH="${{ steps.branch.outputs.original }}"
          if [[ "$BRANCH" == "master" ]] || [[ "$BRANCH" == "refs/heads/master" ]]; then
            echo "❌ Staging deployments cannot be triggered from master branch"
            echo "Use 'Deploy - Production' workflow for master branch"
            exit 1
          fi
          echo "✅ Deploying from branch: $BRANCH"

  # ==============================================
  # Job 2: Build and Push Docker Images
  # ==============================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ needs.validate.outputs.branch }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================
  # Job 3: Deploy to Staging VPS
  # ==============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment:
      name: staging
      url: https://st.motivbuy.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            mkdir -p ${{ secrets.VPS_STAGING_DEPLOY_PATH }}
          "

      - name: Copy deployment files
        run: |
          scp docker-compose.production.yml \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }}:${{ secrets.VPS_STAGING_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -r docker \
              ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }}:${{ secrets.VPS_STAGING_DEPLOY_PATH }}/
          fi

      - name: Create environment file
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            cat > ${{ secrets.VPS_STAGING_DEPLOY_PATH }}/.env << 'EOF'
          NODE_ENV=staging

          # Docker
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=staging

          # Database
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          DB_USER=${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}

          # Redis
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}

          # JWT
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRES_IN=7d

          # Telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}

          # Payment Providers (Optional)
          CRYPTO_BOT_API_TOKEN=${{ secrets.STAGING_CRYPTO_BOT_API_KEY }}

          # Logging
          LOG_LEVEL=debug

          # Domains
          API_DOMAIN=api.st.motivbuy.com
          BOT_DOMAIN=bot.st.motivbuy.com
          MAIN_DOMAIN=st.motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          EOF
          "

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            cd ${{ secrets.VPS_STAGING_DEPLOY_PATH }}

            # Login to registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose pull

            # Run database migrations
            docker compose run --rm api node dist/apps/api/main.js migrate || true

            # Deploy with zero-downtime
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -af --filter 'until=24h'
          "

      - name: Health check
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            # Wait for services to be healthy
            timeout 60 sh -c 'until docker compose -f ${{ secrets.VPS_STAGING_DEPLOY_PATH }}/docker-compose.yml ps | grep -q \"healthy\"; do sleep 2; done' || true

            # Check API health endpoint
            curl -f http://localhost:3000/health || exit 1
          "

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ needs.validate.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Access staging:**" >> $GITHUB_STEP_SUMMARY
            echo "- API: https://api.st.motivbuy.com" >> $GITHUB_STEP_SUMMARY
            echo "- Bot: https://bot.st.motivbuy.com" >> $GITHUB_STEP_SUMMARY
            echo "- Health: https://api.st.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
