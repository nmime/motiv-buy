name: Deploy to Staging

on:
  push:
    branches:
      - '**'
      - '!main'  # Exclude main branch

env:
  PNPM_VERSION: 8
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Build and Push Docker Images
  # ==============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name
        id: branch
        run: |
          # Get branch name and sanitize it for Docker tag
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./monorepo
          file: ./monorepo/Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ steps.branch.outputs.name }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================
  # Job 2: Deploy to Staging VPS
  # ==============================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on VPS
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            mkdir -p ${{ secrets.VPS_STAGING_DEPLOY_PATH }}
          "

      - name: Copy deployment files to VPS
        run: |
          scp docker-compose.production.yml \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }}:${{ secrets.VPS_STAGING_DEPLOY_PATH }}/docker-compose.yml

          scp -r docker \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }}:${{ secrets.VPS_STAGING_DEPLOY_PATH }}/

      - name: Create .env file on VPS
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            cat > ${{ secrets.VPS_STAGING_DEPLOY_PATH }}/.env << 'EOF'
          NODE_ENV=staging

          # Docker
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=staging

          # Database
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          DB_USER=${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}

          # Redis
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}

          # JWT
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRES_IN=7d

          # Telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}

          # Payment
          CRYPTO_BOT_API_KEY=${{ secrets.STAGING_CRYPTO_BOT_API_KEY }}

          # Logging
          LOG_LEVEL=debug
          EOF
          "

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            cd ${{ secrets.VPS_STAGING_DEPLOY_PATH }}

            # Login to registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose pull

            # Run database migrations
            docker compose run --rm api node dist/apps/api/main.js migrate

            # Deploy with zero-downtime
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -af --filter 'until=24h'
          "

      - name: Health check
        run: |
          ssh ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} "
            # Wait for services to be healthy
            timeout 60 sh -c 'until docker compose -f ${{ secrets.VPS_STAGING_DEPLOY_PATH }}/docker-compose.yml ps | grep -q \"healthy\"; do sleep 2; done'

            # Check API health endpoint
            curl -f http://localhost:3000/health || exit 1
          "

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Staging deployment successful for branch: ${{ steps.branch.outputs.name }}"
          else
            echo "❌ Staging deployment failed for branch: ${{ steps.branch.outputs.name }}"
          fi
