name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

env:
  PNPM_VERSION: 9

jobs:
  # ==============================================
  # Job 1: Code Quality & Tests
  # ==============================================
  quality:
    name: Quality & Tests
    runs-on: [self-hosted, linux]
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint
        continue-on-error: true

      - name: Check code formatting
        run: pnpm run format:check
        continue-on-error: true

      - name: Run tests
        run: pnpm run test
        continue-on-error: true

      - name: Generate coverage report
        run: pnpm run test:coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ==============================================
  # Job 2: Docker Build & Validation
  # ==============================================
  docker:
    name: Docker Build (All Apps)
    runs-on: [self-hosted, linux]
    # Run in parallel with quality for faster execution
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Docker images in parallel
        run: |
          set -euo pipefail

          echo "🐳 Building all images in parallel..."

          # Build API in background
          docker buildx build \
            --build-arg APP_NAME=api \
            --tag motiv-buy-api:ci-${{ github.sha }} \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api \
            --load \
            -f Dockerfile . &
          API_PID=$!

          # Build Bot in background
          docker buildx build \
            --build-arg APP_NAME=bot \
            --tag motiv-buy-bot:ci-${{ github.sha }} \
            --cache-from type=gha,scope=bot \
            --cache-to type=gha,mode=max,scope=bot \
            --load \
            -f Dockerfile . &
          BOT_PID=$!

          # Build Migration in background
          docker buildx build \
            --build-arg APP_NAME=migration \
            --tag motiv-buy-migration:ci-${{ github.sha }} \
            --cache-from type=gha,scope=migration \
            --cache-to type=gha,mode=max,scope=migration \
            --load \
            -f Dockerfile . &
          MIGRATION_PID=$!

          # Wait for all builds and capture exit codes
          EXIT_CODE=0

          echo "⏳ Waiting for API build (PID: $API_PID)..."
          if ! wait $API_PID; then
            echo "❌ API build failed"
            EXIT_CODE=1
          else
            echo "✅ API build succeeded"
          fi

          echo "⏳ Waiting for Bot build (PID: $BOT_PID)..."
          if ! wait $BOT_PID; then
            echo "❌ Bot build failed"
            EXIT_CODE=1
          else
            echo "✅ Bot build succeeded"
          fi

          echo "⏳ Waiting for Migration build (PID: $MIGRATION_PID)..."
          if ! wait $MIGRATION_PID; then
            echo "❌ Migration build failed"
            EXIT_CODE=1
          else
            echo "✅ Migration build succeeded"
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ One or more builds failed"
            exit 1
          fi

          echo ""
          echo "✅ All builds completed successfully!"

          # Show built images
          echo ""
          echo "📦 Built images:"
          docker images | grep "motiv-buy.*ci-${{ github.sha }}"

  # ==============================================
  # Job 3: Security Scanning
  # ==============================================
  security:
    name: Security Scan
    runs-on: [self-hosted, linux]
    # Run in parallel with quality for faster execution
    if: always()
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan
          path: trivy-results.sarif
          retention-days: 30

  # ==============================================
  # Job 4: CI Summary
  # ==============================================
  summary:
    name: CI Summary
    runs-on: [self-hosted, linux]
    needs: [quality, docker, security]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "### CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Quality & Tests: ${{ needs.quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.docker.result }}" == "success" ]]; then
            echo "✅ All critical checks passed! Ready to deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker build failed. Fix issues before deploying." >> $GITHUB_STEP_SUMMARY
          fi
