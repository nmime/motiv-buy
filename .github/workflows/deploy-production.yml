name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Production environment'
        required: false
        default: 'production'
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 0: Validate master branch
  # ==============================================
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check if master branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "❌ Production deployments can only be triggered from master branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Deploying from master branch"

  # ==============================================
  # Job 1: Build and Push Docker Images
  # ==============================================
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================
  # Job 2: Database Backup (Pre-deployment)
  # ==============================================
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create database backup
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            # Create backup directory
            mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups

            # Backup database
            BACKUP_FILE=\$HOME/backups/db-backup-\$(date +%Y%m%d-%H%M%S).sql
            docker compose -f ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml exec -T postgres \
              pg_dump -U \$DB_USER \$DB_NAME > \$BACKUP_FILE

            # Keep only last 7 backups
            ls -t \$HOME/backups/db-backup-*.sql | tail -n +8 | xargs rm -f

            echo '✅ Database backup created: \$BACKUP_FILE'
          "

  # ==============================================
  # Job 3: Deploy to Production VPS
  # ==============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, backup]
    environment:
      name: production
      url: https://api.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on VPS
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}
          "

      - name: Copy deployment files to VPS
        run: |
          scp docker-compose.production.yml \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml

          scp -r docker \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/

      - name: Create/Update .env file on VPS
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cat > ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/.env << 'EOF'
          NODE_ENV=production

          # Docker
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest

          # Database
          DB_NAME=${{ secrets.PRODUCTION_DB_NAME }}
          DB_USER=${{ secrets.PRODUCTION_DB_USER }}
          DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}

          # Redis
          REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}

          # JWT
          JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }}
          JWT_EXPIRES_IN=7d

          # Telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}

          # Payment
          CRYPTO_BOT_API_KEY=${{ secrets.PRODUCTION_CRYPTO_BOT_API_KEY }}

          # Logging
          LOG_LEVEL=warn

          # Domain
          DOMAIN=${{ secrets.PRODUCTION_DOMAIN }}
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          EOF
          "

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            # Login to registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose pull

            # Run database migrations
            echo '🔄 Running database migrations...'
            docker compose run --rm api node dist/apps/api/main.js migrate

            # Deploy with zero-downtime rolling update
            echo '🚀 Deploying application...'
            docker compose up -d --remove-orphans --no-deps api bot

            # Wait for services to be healthy
            echo '⏳ Waiting for services to be healthy...'
            sleep 10

            # Clean up old images
            docker image prune -af --filter 'until=48h'
          "

      - name: Health check
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            # Wait for services to be healthy
            timeout 120 sh -c 'until docker compose ps | grep -q \"healthy\"; do sleep 3; done'

            # Check API health endpoint
            curl -f http://localhost:3000/health || exit 1

            echo '✅ Health check passed'
          "

      - name: Smoke tests
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            # Basic smoke tests
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost:3000/api || exit 1

            echo '✅ Smoke tests passed'
          "

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Production deployment successful - Version: ${{ needs.build-and-push.outputs.version }}"
          else
            echo "❌ Production deployment failed - Rolling back may be required"
          fi

  # ==============================================
  # Job 4: Rollback (Manual Trigger Only)
  # ==============================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback to previous version
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            echo '⚠️ Rolling back deployment...'

            # Pull previous image tag (you may want to maintain a version file)
            # docker compose pull --ignore-pull-failures

            # Restart services with previous version
            docker compose down
            docker compose up -d

            echo '✅ Rollback completed'
          "
