name: Deploy - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Validate master branch
  # ==============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if master branch
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "❌ Production deployments can only be triggered from master branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Deploying from master branch"

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]] && [[ "${{ inputs.version }}" != "latest" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="latest"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  # ==============================================
  # Job 2: Build and Push Docker Images
  # ==============================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ needs.validate.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================
  # Job 3: Database Backup (Pre-deployment)
  # ==============================================
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create database backup
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << "BACKUP_EOF"
          set -euo pipefail

          # Create backup directory
          mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups

          # Backup database
          BACKUP_FILE="${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/db-backup-$(date +%Y%m%d-%H%M%S).sql"

          echo "📦 Creating database backup: $BACKUP_FILE"

          # Create backup with error checking
          if docker compose -f ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml exec -T postgres \
            pg_dump -U ${{ secrets.PRODUCTION_DB_USER }} ${{ secrets.PRODUCTION_DB_NAME }} > "$BACKUP_FILE"; then

            # Verify backup file is not empty
            if [ -s "$BACKUP_FILE" ]; then
              BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)

              # Validate SQL content (check for PostgreSQL dump header)
              if head -5 "$BACKUP_FILE" | grep -q "PostgreSQL database dump"; then
                echo "✅ Backup created successfully: $BACKUP_FILE ($BACKUP_SIZE)"
                echo "✅ SQL content validated"
              else
                echo "❌ Backup file exists but doesn't appear to be a valid PostgreSQL dump!"
                rm -f "$BACKUP_FILE"
                exit 1
              fi
            else
              echo "❌ Backup file is empty!"
              rm -f "$BACKUP_FILE"
              exit 1
            fi
          else
            echo "❌ Backup failed!"
            exit 1
          fi

          # Keep only last 7 backups (with logging)
          echo "🗑️ Cleaning old backups..."
          REMOVED=$(ls -t ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/db-backup-*.sql 2>/dev/null | tail -n +8 | tee /dev/stderr | wc -l)
          ls -t ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/db-backup-*.sql 2>/dev/null | tail -n +8 | xargs rm -f || true
          echo "Removed $REMOVED old backup(s)"
          BACKUP_EOF

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

  # ==============================================
  # Job 4: Deploy to Production VPS
  # ==============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, build, backup]
    environment:
      name: production
      url: https://motivbuy.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} \
            "mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}"

      - name: Copy deployment files
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/
          fi

      - name: Create environment file
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/.env << 'EOF'
          NODE_ENV=production

          # Docker
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest

          # Database
          DB_NAME=${{ secrets.PRODUCTION_DB_NAME }}
          DB_USER=${{ secrets.PRODUCTION_DB_USER }}
          DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}

          # Redis
          REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}

          # JWT
          JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }}
          JWT_EXPIRES_IN=7d

          # Telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}

          # Payment
          CRYPTO_BOT_API_KEY=${{ secrets.PRODUCTION_CRYPTO_BOT_API_KEY }}

          # Logging
          LOG_LEVEL=warn

          # Domains
          API_DOMAIN=api.motivbuy.com
          BOT_DOMAIN=bot.motivbuy.com
          MAIN_DOMAIN=motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          EOF
          ENV_EOF

      - name: Deploy with Docker Compose
        run: |
          set -euo pipefail

          # Create deployment script
          cat > /tmp/deploy-script.sh << 'SCRIPT_EOF'
          set -euo pipefail

          cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

          # Login to registry (token from stdin for security)
          docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull latest images
          docker compose pull

          # NOTE: Database migrations must be run manually using the
          # 'Run Database Migrations' workflow before deployment
          # This ensures migrations are reviewed and controlled in production

          # Deploy with zero-downtime rolling update
          echo '🚀 Deploying application...'
          docker compose up -d --remove-orphans --no-deps api bot

          # Wait for services to be healthy
          echo '⏳ Waiting for services to be healthy...'
          sleep 10

          # Clean up old images
          docker image prune -af --filter 'until=48h'

          echo '✅ Deployment completed'
          SCRIPT_EOF

          chmod +x /tmp/deploy-script.sh

          # Execute deployment, passing GitHub token via stdin
          echo '${{ secrets.GITHUB_TOKEN }}' | ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} \
            'bash -s' < /tmp/deploy-script.sh

          # Cleanup
          rm -f /tmp/deploy-script.sh

      - name: Health check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << 'HEALTH_EOF'
          set -euo pipefail

          cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

          # Wait for services to be healthy
          timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 3; done' || true

          # Check API health endpoint
          if curl -f http://localhost:3000/health; then
            echo '✅ Health check passed'
          else
            echo '❌ Health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Smoke tests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << 'SMOKE_EOF'
          set -euo pipefail

          # Basic smoke tests
          if curl -f http://localhost:3000/health && \
             curl -f http://localhost:3000/api; then
            echo '✅ Smoke tests passed'
          else
            echo '❌ Smoke tests failed'
            exit 1
          fi
          SMOKE_EOF

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🎉 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Access production:**" >> $GITHUB_STEP_SUMMARY
            echo "- API: https://api.motivbuy.com" >> $GITHUB_STEP_SUMMARY
            echo "- Bot: https://bot.motivbuy.com" >> $GITHUB_STEP_SUMMARY
            echo "- Health: https://api.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "**Rollback may be required.**" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ==============================================
  # Job 5: Rollback (On Failure)
  # ==============================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy

    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback to previous version
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << 'ROLLBACK_EOF'
          set -euo pipefail

          cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

          echo '⚠️ Rolling back deployment...'

          # Restart services with previous version
          docker compose down
          docker compose up -d

          echo '✅ Rollback completed'
          ROLLBACK_EOF

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
