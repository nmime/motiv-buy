name: Deploy - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Validate master branch
  # ==============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if master branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "❌ Production deployments can only be triggered from master branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Deploying from master branch"

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]] && [[ "${{ inputs.version }}" != "latest" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="latest"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  # ==============================================
  # Job 2: Build and Push Docker Images
  # ==============================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ needs.validate.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================
  # Job 3: Database Backup (Pre-deployment)
  # ==============================================
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create database backup
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            # Create backup directory
            mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups

            # Backup database
            BACKUP_FILE=${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/db-backup-\$(date +%Y%m%d-%H%M%S).sql
            docker compose -f ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml exec -T postgres \
              pg_dump -U \$DB_USER \$DB_NAME > \$BACKUP_FILE || true

            # Keep only last 7 backups
            ls -t ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/backups/db-backup-*.sql 2>/dev/null | tail -n +8 | xargs rm -f || true

            echo '✅ Database backup created: '\$BACKUP_FILE
          "

  # ==============================================
  # Job 4: Deploy to Production VPS
  # ==============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, build, backup]
    environment:
      name: production
      url: https://motivbuy.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}
          "

      - name: Copy deployment files
        run: |
          scp docker-compose.production.yml \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -r docker \
              ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/
          fi

      - name: Create environment file
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cat > ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/.env << 'EOF'
          NODE_ENV=production

          # Docker
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest

          # Database
          DB_NAME=${{ secrets.PRODUCTION_DB_NAME }}
          DB_USER=${{ secrets.PRODUCTION_DB_USER }}
          DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}

          # Redis
          REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}

          # JWT
          JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }}
          JWT_EXPIRES_IN=7d

          # Telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}

          # Payment
          CRYPTO_BOT_API_KEY=${{ secrets.PRODUCTION_CRYPTO_BOT_API_KEY }}

          # Logging
          LOG_LEVEL=warn

          # Domains
          API_DOMAIN=api.motivbuy.com
          BOT_DOMAIN=bot.motivbuy.com
          MAIN_DOMAIN=motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          EOF
          "

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            # Login to registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose pull

            # Run database migrations
            echo '🔄 Running database migrations...'
            docker compose run --rm api node dist/apps/api/main.js migrate || true

            # Deploy with zero-downtime rolling update
            echo '🚀 Deploying application...'
            docker compose up -d --remove-orphans --no-deps api bot

            # Wait for services to be healthy
            echo '⏳ Waiting for services to be healthy...'
            sleep 10

            # Clean up old images
            docker image prune -af --filter 'until=48h'
          "

      - name: Health check
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            # Wait for services to be healthy
            timeout 120 sh -c 'until docker compose ps | grep -q \"healthy\"; do sleep 3; done' || true

            # Check API health endpoint
            curl -f http://localhost:3000/health || exit 1

            echo '✅ Health check passed'
          "

      - name: Smoke tests
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            # Basic smoke tests
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost:3000/api || exit 1

            echo '✅ Smoke tests passed'
          "

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🎉 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Access production:**" >> $GITHUB_STEP_SUMMARY
            echo "- API: https://api.motivbuy.com" >> $GITHUB_STEP_SUMMARY
            echo "- Bot: https://bot.motivbuy.com" >> $GITHUB_STEP_SUMMARY
            echo "- Health: https://api.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "**Rollback may be required.**" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ==============================================
  # Job 5: Rollback (On Failure)
  # ==============================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback to previous version
        run: |
          ssh ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} "
            cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}

            echo '⚠️ Rolling back deployment...'

            # Restart services with previous version
            docker compose down
            docker compose up -d

            echo '✅ Rollback completed'
          "
