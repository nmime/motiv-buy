name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Run at 2 AM UTC every Monday
    - cron: '0 2 * * 1'

jobs:
  codeql:
    name: Analysis
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: '/language:typescript'
          upload: false
          output: sarif-results

      - name: Upload CodeQL results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-security-analysis
          path: sarif-results/typescript.sarif
          retention-days: 30

      - name: Report Analysis Status
        if: always()
        run: |
          echo "### 🔒 CodeQL Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Analysis | ${{ steps.analyze.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.analyze.outcome }}" != "success" ]]; then
            echo "## ⚠️ Security Analysis Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CodeQL analysis completed with warnings or errors." >> $GITHUB_STEP_SUMMARY
            echo "Review the uploaded SARIF artifact for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "::warning::CodeQL analysis found potential security issues. Review the results."
          else
            echo "## ✅ Security Analysis Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No security issues detected by CodeQL analysis." >> $GITHUB_STEP_SUMMARY
          fi
