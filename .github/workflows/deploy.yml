name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: 'staging'
      ref:
        description: 'Branch or tag to deploy (leave empty for current branch)'
        required: false
        default: ''

concurrency:
  group: deployment-${{ inputs.environment }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Validate
  # ==============================================
  validate:
    name: Validate
    runs-on: [self-hosted, linux]
    outputs:
      ref-name: ${{ steps.ref.outputs.name }}
      deploy-staging: ${{ steps.check.outputs.staging }}
      deploy-production: ${{ steps.check.outputs.production }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Extract ref name
        id: ref
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.ref }}" ]]; then
            REF_NAME="${{ inputs.ref }}"
          else
            REF_NAME=${GITHUB_REF#refs/heads/}
          fi
          SANITIZED_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SANITIZED_REF" >> $GITHUB_OUTPUT
          echo "original=$REF_NAME" >> $GITHUB_OUTPUT

      - name: Validate deployment target
        id: check
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          REF="${{ steps.ref.outputs.original }}"

          # Check production deployment requirements
          if [[ "$ENV" == "production" ]] || [[ "$ENV" == "both" ]]; then
            if [[ "$REF" != "master" ]] && [[ "$REF" != "refs/heads/master" ]]; then
              echo "❌ Production deployments can only be from master branch"
              echo "Current ref: $REF"
              exit 1
            fi
            echo "production=true" >> $GITHUB_OUTPUT
          else
            echo "production=false" >> $GITHUB_OUTPUT
          fi

          # Check staging deployment requirements
          if [[ "$ENV" == "staging" ]] || [[ "$ENV" == "both" ]]; then
            echo "staging=true" >> $GITHUB_OUTPUT
          else
            echo "staging=false" >> $GITHUB_OUTPUT
          fi

          echo "✅ Validation passed for environment: $ENV"

  # ==============================================
  # Job 2: Build and Push Docker Images
  # ==============================================
  build:
    name: Build & Push
    runs-on: [self-hosted, linux]
    needs: validate

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          TAGS=""

          # Add staging tags if deploying to staging
          if [[ "${{ needs.validate.outputs.deploy-staging }}" == "true" ]]; then
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging"
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ needs.validate.outputs.ref-name }}"
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging-${{ github.sha }}"
          fi

          # Add production tags if deploying to production
          if [[ "${{ needs.validate.outputs.deploy-production }}" == "true" ]]; then
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:latest"
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:prod-${{ github.sha }}"
          fi

          # Convert to newline-separated for docker/build-push-action
          TAGS=$(echo $TAGS | tr ' ' '\n')
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: ${{ steps.tags.outputs.list }}
          # Use shared cache for common stages (deps, libs-builder, prod-deps) + app-specific cache
          cache-from: |
            type=gha,scope=shared
            type=gha,scope=${{ matrix.app }}

  # ==============================================
  # Job 3: Deploy to Staging
  # ==============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, linux]
    needs: [validate, build]
    if: needs.validate.outputs.deploy-staging == 'true'
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail

          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "mkdir -p ${{ vars.VPS_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/
          fi

          # Create environment file
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ vars.VPS_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=staging
          PROJECT_NAME=motiv-buy
          ENV=staging
          VPS_DEPLOY_PATH=${{ vars.VPS_DEPLOY_PATH }}
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=staging
          PORT=3000
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=debug
          RATE_LIMIT_MAX=100
          RATE_LIMIT_WINDOW=900000
          API_DOMAIN=api.st.motivbuy.com
          BOT_DOMAIN=bot.st.motivbuy.com
          MAIN_DOMAIN=st.motivbuy.com
          LETSENCRYPT_EMAIL=${{ vars.LETSENCRYPT_EMAIL }}
          API_PORT_EXTERNAL=3001
          DB_PORT_EXTERNAL=5433
          REDIS_PORT_EXTERNAL=6381
          NATS_PORT_EXTERNAL=4223
          NATS_MONITOR_PORT=8223
          HTTP_PORT=80
          HTTPS_PORT=443
          PROMETHEUS_PORT=9090
          GRAFANA_PORT=3002
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          NATS_USER=
          NATS_PASSWORD=
          ENVFILE
          ENV_EOF

          # Deploy
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}'" bash << 'DEPLOY_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Create data directories if they don't exist
          mkdir -p data/postgres data/redis data/nats data/nginx/logs data/prometheus data/grafana

          # Login to Docker registry
          echo "$GITHUB_TOKEN" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull latest images
          docker compose pull

          # Deploy with zero-downtime
          echo '🚀 Deploying staging (zero-downtime rolling update)...'
          docker compose up -d --remove-orphans --wait --wait-timeout 120
          echo '✅ Staging deployment completed'

          # Cleanup old images
          docker image prune -af --filter 'until=24h'
          DEPLOY_EOF

      - name: Health Check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          timeout 60 sh -c 'until docker compose -f ${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml ps | grep -q "healthy"; do sleep 2; done' || true
          if curl -f http://localhost:3000/health; then
            echo '✅ Staging health check passed'
          else
            echo '❌ Staging health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ==============================================
  # Job 4: Deploy to Production
  # ==============================================
  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [validate, build]
    if: needs.validate.outputs.deploy-production == 'true'
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail

          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "mkdir -p ${{ vars.VPS_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_DEPLOY_PATH }}/
          fi

          # Create environment file
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ vars.VPS_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=production
          PROJECT_NAME=motiv-buy
          ENV=production
          VPS_DEPLOY_PATH=${{ vars.VPS_DEPLOY_PATH }}
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest
          PORT=3000
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=warn
          RATE_LIMIT_MAX=100
          RATE_LIMIT_WINDOW=900000
          API_DOMAIN=api.motivbuy.com
          BOT_DOMAIN=bot.motivbuy.com
          MAIN_DOMAIN=motivbuy.com
          LETSENCRYPT_EMAIL=${{ vars.LETSENCRYPT_EMAIL }}
          API_PORT_EXTERNAL=3001
          DB_PORT_EXTERNAL=5433
          REDIS_PORT_EXTERNAL=6381
          NATS_PORT_EXTERNAL=4223
          NATS_MONITOR_PORT=8223
          HTTP_PORT=80
          HTTPS_PORT=443
          PROMETHEUS_PORT=9090
          GRAFANA_PORT=3002
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          NATS_USER=
          NATS_PASSWORD=
          ENVFILE
          ENV_EOF

          # Deploy
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            "GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}'" bash << 'DEPLOY_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}

          # Create data directories if they don't exist
          mkdir -p data/postgres data/redis data/nats data/nginx/logs data/prometheus data/grafana

          # Login to Docker registry
          echo "$GITHUB_TOKEN" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull latest images
          docker compose pull

          # Deploy with zero-downtime
          echo '🚀 Deploying production (zero-downtime rolling update)...'
          docker compose up -d --remove-orphans --wait --wait-timeout 180
          echo '✅ Production deployment completed'

          # Cleanup old images
          docker image prune -af --filter 'until=48h'
          DEPLOY_EOF

      - name: Health Check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          cd ${{ vars.VPS_DEPLOY_PATH }}
          timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 3; done' || true
          if curl -f http://localhost:3000/health; then
            echo '✅ Production health check passed'
          else
            echo '❌ Production health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Smoke Tests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'SMOKE_EOF'
          set -euo pipefail
          if curl -f http://localhost:3000/health && curl -f http://localhost:3000/api; then
            echo '✅ Production smoke tests passed'
          else
            echo '❌ Production smoke tests failed'
            exit 1
          fi
          SMOKE_EOF

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ==============================================
  # Job 5: Deployment Summary
  # ==============================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux]
    needs: [validate, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ needs.validate.outputs.ref-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Staging status
          if [[ "${{ needs.validate.outputs.deploy-staging }}" == "true" ]]; then
            echo "**Staging Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.st.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.st.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Production status
          if [[ "${{ needs.validate.outputs.deploy-production }}" == "true" ]]; then
            echo "**Production Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
