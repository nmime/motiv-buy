name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: 'staging'
      ref:
        description: 'Branch or tag to deploy (leave empty for current branch)'
        required: false
        default: ''

concurrency:
  group: deployment-${{ inputs.environment }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ==============================================
  # Job 1: Validate
  # ==============================================
  validate:
    name: Validate
    runs-on: [self-hosted, linux]
    outputs:
      ref-name: ${{ steps.ref.outputs.name }}
      deploy-staging: ${{ steps.check.outputs.staging }}
      deploy-production: ${{ steps.check.outputs.production }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Extract ref name
        id: ref
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.ref }}" ]]; then
            REF_NAME="${{ inputs.ref }}"
          else
            REF_NAME=${GITHUB_REF#refs/heads/}
          fi
          SANITIZED_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SANITIZED_REF" >> $GITHUB_OUTPUT
          echo "original=$REF_NAME" >> $GITHUB_OUTPUT

      - name: Validate deployment target
        id: check
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          REF="${{ steps.ref.outputs.original }}"

          # Check production deployment requirements
          if [[ "$ENV" == "production" ]] || [[ "$ENV" == "both" ]]; then
            if [[ "$REF" != "master" ]] && [[ "$REF" != "refs/heads/master" ]]; then
              echo "❌ Production deployments can only be from master branch"
              echo "Current ref: $REF"
              exit 1
            fi
            echo "production=true" >> $GITHUB_OUTPUT
          else
            echo "production=false" >> $GITHUB_OUTPUT
          fi

          # Check staging deployment requirements
          if [[ "$ENV" == "staging" ]] || [[ "$ENV" == "both" ]]; then
            if [[ "$REF" == "master" ]] || [[ "$REF" == "refs/heads/master" ]]; then
              echo "❌ Staging deployments cannot be from master branch"
              echo "Use a feature branch or develop branch"
              exit 1
            fi
            echo "staging=true" >> $GITHUB_OUTPUT
          else
            echo "staging=false" >> $GITHUB_OUTPUT
          fi

          echo "✅ Validation passed for environment: $ENV"

  # ==============================================
  # Job 2: Build and Push Docker Images
  # ==============================================
  build:
    name: Build & Push
    runs-on: [self-hosted, linux]
    needs: validate

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, bot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          TAGS=""

          # Add staging tags if deploying to staging
          if [[ "${{ needs.validate.outputs.deploy-staging }}" == "true" ]]; then
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging"
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:${{ needs.validate.outputs.ref-name }}"
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:staging-${{ github.sha }}"
          fi

          # Add production tags if deploying to production
          if [[ "${{ needs.validate.outputs.deploy-production }}" == "true" ]]; then
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:latest"
            TAGS="$TAGS ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/motiv-buy-${{ matrix.app }}:prod-${{ github.sha }}"
          fi

          # Convert to newline-separated for docker/build-push-action
          TAGS=$(echo $TAGS | tr ' ' '\n')
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: ${{ steps.tags.outputs.list }}
          # Use shared cache for common stages (deps, libs-builder, prod-deps) + app-specific cache
          cache-from: |
            type=gha,scope=shared
            type=gha,scope=${{ matrix.app }}
          cache-to: |
            type=gha,mode=max,scope=shared
            type=gha,mode=max,scope=${{ matrix.app }}

  # ==============================================
  # Job 3: Deploy
  # ==============================================
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: [self-hosted, linux]
    needs: [validate, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ==============================================
      # Staging Deployment
      # ==============================================
      - name: Setup SSH for Staging
        if: needs.validate.outputs.deploy-staging == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        if: needs.validate.outputs.deploy-staging == 'true'
        env:
          ENVIRONMENT: staging
        run: |
          set -euo pipefail
          
          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} \
            "mkdir -p ${{ secrets.VPS_STAGING_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }}:${{ secrets.VPS_STAGING_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }}:${{ secrets.VPS_STAGING_DEPLOY_PATH }}/
          fi

          # Create environment file
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ secrets.VPS_STAGING_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=staging
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=staging
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          DB_USER=${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.STAGING_CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=debug
          API_DOMAIN=api.st.motivbuy.com
          BOT_DOMAIN=bot.st.motivbuy.com
          MAIN_DOMAIN=st.motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          ENVFILE
          ENV_EOF

          # Deploy
          cat > /tmp/deploy-script.sh << 'SCRIPT_EOF'
          set -euo pipefail
          cd ${{ secrets.VPS_STAGING_DEPLOY_PATH }}
          docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker compose pull
          echo '🚀 Deploying staging...'
          docker compose up -d --remove-orphans
          docker image prune -af --filter 'until=24h'
          echo '✅ Staging deployment completed'
          SCRIPT_EOF

          chmod +x /tmp/deploy-script.sh
          echo '${{ secrets.GITHUB_TOKEN }}' | ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} \
            'bash -s' < /tmp/deploy-script.sh
          rm -f /tmp/deploy-script.sh

      - name: Health Check - Staging
        if: needs.validate.outputs.deploy-staging == 'true'
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_STAGING_USER }}@${{ secrets.VPS_STAGING_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          timeout 60 sh -c 'until docker compose -f ${{ secrets.VPS_STAGING_DEPLOY_PATH }}/docker-compose.yml ps | grep -q "healthy"; do sleep 2; done' || true
          if curl -f http://localhost:3000/health; then
            echo '✅ Staging health check passed'
          else
            echo '❌ Staging health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Cleanup SSH - Staging
        if: needs.validate.outputs.deploy-staging == 'true' && always()
        run: rm -f ~/.ssh/id_rsa

      # ==============================================
      # Production Deployment
      # ==============================================
      - name: Setup SSH for Production
        if: needs.validate.outputs.deploy-production == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production
        if: needs.validate.outputs.deploy-production == 'true'
        env:
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          
          # Create deployment directory
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} \
            "mkdir -p ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}"

          # Copy deployment files
          scp -o StrictHostKeyChecking=yes docker-compose.production.yml \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/docker-compose.yml

          if [ -d "docker" ]; then
            scp -o StrictHostKeyChecking=yes -r docker \
              ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }}:${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/
          fi

          # Create environment file
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << "ENV_EOF"
          set -euo pipefail
          cat > ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}/.env << 'ENVFILE'
          NODE_ENV=production
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          DOCKER_IMAGE_PREFIX=${{ github.repository_owner }}/motiv-buy
          IMAGE_TAG=latest
          DB_NAME=${{ secrets.PRODUCTION_DB_NAME }}
          DB_USER=${{ secrets.PRODUCTION_DB_USER }}
          DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          TELEGRAM_BOT_TOKEN=${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_API_TOKEN=${{ secrets.PRODUCTION_CRYPTO_BOT_API_TOKEN }}
          LOG_LEVEL=warn
          API_DOMAIN=api.motivbuy.com
          BOT_DOMAIN=bot.motivbuy.com
          MAIN_DOMAIN=motivbuy.com
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          ENVFILE
          ENV_EOF

          # Deploy
          cat > /tmp/deploy-script.sh << 'SCRIPT_EOF'
          set -euo pipefail
          cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}
          docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker compose pull
          echo '🚀 Deploying production...'
          docker compose up -d --remove-orphans --no-deps api bot
          echo '⏳ Waiting for services...'
          sleep 10
          docker image prune -af --filter 'until=48h'
          echo '✅ Production deployment completed'
          SCRIPT_EOF

          chmod +x /tmp/deploy-script.sh
          echo '${{ secrets.GITHUB_TOKEN }}' | ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} \
            'bash -s' < /tmp/deploy-script.sh
          rm -f /tmp/deploy-script.sh

      - name: Health Check - Production
        if: needs.validate.outputs.deploy-production == 'true'
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << 'HEALTH_EOF'
          set -euo pipefail
          cd ${{ secrets.VPS_PRODUCTION_DEPLOY_PATH }}
          timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 3; done' || true
          if curl -f http://localhost:3000/health; then
            echo '✅ Production health check passed'
          else
            echo '❌ Production health check failed'
            exit 1
          fi
          HEALTH_EOF

      - name: Smoke Tests - Production
        if: needs.validate.outputs.deploy-production == 'true'
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_PRODUCTION_USER }}@${{ secrets.VPS_PRODUCTION_HOST }} << 'SMOKE_EOF'
          set -euo pipefail
          if curl -f http://localhost:3000/health && curl -f http://localhost:3000/api; then
            echo '✅ Production smoke tests passed'
          else
            echo '❌ Production smoke tests failed'
            exit 1
          fi
          SMOKE_EOF

      - name: Cleanup SSH - Production
        if: needs.validate.outputs.deploy-production == 'true' && always()
        run: rm -f ~/.ssh/id_rsa

  # ==============================================
  # Job 4: Deployment Summary
  # ==============================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux]
    needs: [validate, deploy]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ needs.validate.outputs.ref-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Staging status
          if [[ "${{ needs.validate.outputs.deploy-staging }}" == "true" ]]; then
            echo "**Staging Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.st.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.st.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Production status
          if [[ "${{ needs.validate.outputs.deploy-production }}" == "true" ]]; then
            echo "**Production Deployment**" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy.result }}" == "success" ]]; then
              echo "- ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
              echo "- API: https://api.motivbuy.com" >> $GITHUB_STEP_SUMMARY
              echo "- Health: https://api.motivbuy.com/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
