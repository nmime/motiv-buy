# Application Docker Compose (Local Build)
# API, Bot, Monitoring
# Prerequisites: docker compose -f docker-compose.infra.yml up -d
# Usage: docker compose -f docker-compose.local.yml up -d --build

x-common-defaults: &common-defaults
  restart: unless-stopped
  networks:
    - motiv-infra

x-healthcheck-standard: &healthcheck-standard
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  PROJECT_NAME: ${PROJECT_NAME:-motiv-buy}
  ENV: ${ENV:-dev}

x-db-env: &db-env
  DB_HOST: motiv-postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

x-redis-env: &redis-env
  REDIS_MODE: ${REDIS_MODE:-default}
  REDIS_HOSTS: motiv-redis:6379
  REDIS_HOST: motiv-redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-nats-env: &nats-env
  NATS_URL: nats://motiv-nats:4222
  NATS_CLIENT_NAME: ${PROJECT_NAME:-motiv-buy}-app

x-api-resources: &api-resources
  resources:
    limits:
      cpus: '1.0'
      memory: 512M
    reservations:
      cpus: '0.5'
      memory: 256M

x-bot-resources: &bot-resources
  resources:
    limits:
      cpus: '0.5'
      memory: 256M
    reservations:
      cpus: '0.25'
      memory: 128M

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
    container_name: ${PROJECT_NAME:-motiv-buy}-api
    <<: *common-defaults
    env_file:
      - .env
    environment:
      <<: [*common-env, *db-env, *redis-env, *nats-env]
      DB_MIGRATIONS_PATH: ./dist/apps/migration/src/migration
      DB_MIGRATIONS_EMIT: js
    volumes:
      - ./data/api/logs:/app/logs
      - ./data/api/uploads:/app/uploads
      - ./data/api/temp:/app/temp
    ports:
      - '${API_PORT_EXTERNAL:-5501}:${API_PORT:-5501}'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:${API_PORT:-5501}/api/v1/health']
      <<: *healthcheck-standard
    deploy:
      <<: *api-resources

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: bot
    container_name: ${PROJECT_NAME:-motiv-buy}-bot
    <<: *common-defaults
    env_file:
      - .env
    environment:
      <<: [*common-env, *db-env, *redis-env, *nats-env]
      BOT_INSTANCE_ENABLED: 'true'
    volumes:
      - ./data/bot/logs:/app/logs
      - ./data/bot/temp:/app/temp
      - ./data/bot/sessions:/app/sessions
    ports:
      - '${BOT_PORT_EXTERNAL:-5502}:${BOT_PORT:-5502}'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:${BOT_PORT:-5502}/api/v1/health']
      <<: *healthcheck-standard
    deploy:
      <<: *bot-resources

  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME:-motiv-buy}-prometheus
    <<: *common-defaults
    volumes:
      - ./config/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME:-motiv-buy}-grafana
    <<: *common-defaults
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  motiv-infra:
    external: true
    name: motiv-infra
