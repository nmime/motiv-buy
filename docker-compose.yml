version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: motiv-buy-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-motiv_buy_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motiv-buy-network

  # Redis (optional - for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: motiv-buy-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motiv-buy-network

  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        APP_NAME: api
    container_name: motiv-buy-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-motiv_buy_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Auth
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # API Keys (add your actual keys in .env)
      CRYPTO_BOT_API_KEY: ${CRYPTO_BOT_API_KEY}

    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Mount source code for development (hot reload)
      - ./apps/api:/app/apps/api
      - ./libs:/app/libs
      - /app/node_modules
      - /app/dist
    networks:
      - motiv-buy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Bot Application
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        APP_NAME: bot
    container_name: motiv-buy-bot-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-motiv_buy_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Telegram Bot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

      # API Keys
      CRYPTO_BOT_API_KEY: ${CRYPTO_BOT_API_KEY}

    volumes:
      # Mount source code for development (hot reload)
      - ./apps/bot:/app/apps/bot
      - ./libs:/app/libs
      - /app/node_modules
      - /app/dist
    networks:
      - motiv-buy-network

  # Nginx (optional - for local testing of reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: motiv-buy-nginx-dev
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - motiv-buy-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  motiv-buy-network:
    driver: bridge
