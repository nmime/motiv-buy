# Production Docker Compose Configuration
# Uses common prefixes and YAML anchors for maintainability

# ==========================================
# YAML ANCHORS - Common Configuration
# ==========================================

# Common service defaults
x-common-defaults: &common-defaults
  restart: unless-stopped
  networks:
    - app-network

# Common healthcheck configurations
x-healthcheck-fast: &healthcheck-fast
  interval: 10s
  timeout: 3s
  retries: 5

x-healthcheck-standard: &healthcheck-standard
  interval: 30s
  timeout: 10s
  retries: 3

# Common environment variables
x-common-env: &common-env
  NODE_ENV: ${NODE_ENV}
  PROJECT_NAME: ${PROJECT_NAME}
  ENV: ${ENV}

x-db-env: &db-env
  DB_HOST: postgres-prod
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

x-redis-env: &redis-env
  REDIS_HOST: redis-prod
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-nats-env: &nats-env
  NATS_URL: nats://nats-prod:4222
  NATS_CLIENT_NAME: ${PROJECT_NAME}-app
  NATS_USER: ${NATS_USER}
  NATS_PASSWORD: ${NATS_PASSWORD}

# Production resource limits
x-api-resources: &api-resources
  resources:
    limits:
      cpus: '1.0'
      memory: 512M
    reservations:
      cpus: '0.5'
      memory: 256M

x-bot-resources: &bot-resources
  resources:
    limits:
      cpus: '0.5'
      memory: 256M
    reservations:
      cpus: '0.25'
      memory: 128M

# ==========================================
# SERVICES
# ==========================================

services:
  # PostgreSQL Database
  postgres-prod:
    image: postgres:18rc1-alpine
    container_name: ${PROJECT_NAME}-postgres-${ENV}
    <<: *common-defaults
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ${VPS_DEPLOY_PATH}/data/postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - '${DB_PORT_EXTERNAL:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      <<: *healthcheck-fast

  # Redis Cache
  redis-prod:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis-${ENV}
    <<: *common-defaults
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${VPS_DEPLOY_PATH}/data/redis:/data
      - ./config/redis/redis-prod.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - '${REDIS_PORT_EXTERNAL:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      <<: *healthcheck-fast

  # NATS JetStream
  nats-prod:
    image: nats:latest
    container_name: ${PROJECT_NAME}-nats-${ENV}
    <<: *common-defaults
    command: >
      --jetstream
      --store_dir=/data
      --http_port=8222
      ${NATS_USER:+--user=${NATS_USER}}
      ${NATS_PASSWORD:+--pass=${NATS_PASSWORD}}
    volumes:
      - ${VPS_DEPLOY_PATH}/data/nats:/data
    ports:
      - '${NATS_PORT_EXTERNAL:-4223}:4222'
      - '${NATS_MONITOR_PORT:-8223}:8222'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8222/healthz']
      <<: *healthcheck-fast

  # API Application
  api-prod:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}-api:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}-api-${ENV}
    <<: *common-defaults
    environment:
      <<: [*common-env, *db-env, *redis-env, *nats-env]
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
    volumes:
      - ${VPS_DEPLOY_PATH}/data/api/logs:/app/logs
      - ${VPS_DEPLOY_PATH}/data/api/uploads:/app/uploads
      - ${VPS_DEPLOY_PATH}/data/api/temp:/app/temp
    ports:
      - '${API_PORT_EXTERNAL}:${PORT}'
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
      nats-prod:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${PORT}/health']
      <<: *healthcheck-standard
    deploy:
      <<: *api-resources

  # Bot Application
  bot-prod:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}-bot:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}-bot-${ENV}
    <<: *common-defaults
    environment:
      <<: [*common-env, *db-env, *redis-env, *nats-env]
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_BASE_URL: http://api-prod:${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ${VPS_DEPLOY_PATH}/data/bot/logs:/app/logs
      - ${VPS_DEPLOY_PATH}/data/bot/temp:/app/temp
      - ${VPS_DEPLOY_PATH}/data/bot/sessions:/app/sessions
    depends_on:
      api-prod:
        condition: service_healthy
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
      nats-prod:
        condition: service_healthy
    deploy:
      <<: *bot-resources

  # Nginx Reverse Proxy
  nginx-prod:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}-nginx-${ENV}
    <<: *common-defaults
    volumes:
      - ./config/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ${VPS_DEPLOY_PATH}/data/nginx/logs:/var/log/nginx
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    depends_on:
      - api-prod
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      <<: *healthcheck-standard

  # Monitoring - Prometheus
  prometheus-prod:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME}-prometheus-${ENV}
    <<: *common-defaults
    volumes:
      - ./config/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ${VPS_DEPLOY_PATH}/data/prometheus:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    profiles:
      - monitoring

  # Monitoring - Grafana
  grafana-prod:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME}-grafana-${ENV}
    <<: *common-defaults
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ${VPS_DEPLOY_PATH}/data/grafana:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    depends_on:
      - prometheus-prod
    profiles:
      - monitoring

# ==========================================
# NETWORKS
# ==========================================

networks:
  app-network:
    driver: bridge
    name: ${PROJECT_NAME}-${ENV}
