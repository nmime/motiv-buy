# NATS Development Configuration
# This configuration is for development environments only

# Server settings
server_name: nats-dev
port: 4222

# JetStream configuration
jetstream {
  store_dir: /data
  max_memory_store: 1GB
  max_file_store: 10GB
}

# HTTP Monitoring
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# No authentication for development (optional, can be enabled)
# If you want to enable auth in dev, uncomment and set:
# authorization {
#   user: dev_user
#   password: dev_password
# }
