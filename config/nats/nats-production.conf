# NATS Production Configuration
# This configuration uses bcrypt-hashed passwords for security

# Server settings
server_name: nats-prod
port: 4222

# JetStream configuration
jetstream {
  store_dir: /data
  max_memory_store: 5GB
  max_file_store: 20GB
}

# HTTP Monitoring
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# Security: Authentication with bcrypt
# IMPORTANT: Replace $NATS_BCRYPT_PASSWORD with actual bcrypt hash
# Generate hash using: ./scripts/generate-nats-password.sh <your-password>
authorization {
  user: $NATS_USER
  # Bcrypt hashed password
  password: $NATS_BCRYPT_PASSWORD
}

# Additional security settings
# Maximum connections
max_connections: 1000

# Maximum control line (protocol commands)
max_control_line: 4096

# Maximum payload size (1MB)
max_payload: 1048576

# Connection timeout
ping_interval: 120s
ping_max: 3
